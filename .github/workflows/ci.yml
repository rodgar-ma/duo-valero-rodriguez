name: CI

on:
  pull_request:
    branches: [main]

# Un solo despliegue a dev a la vez
concurrency:
  group: ci-dev
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Lee la versión de pnpm del campo packageManager de package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check (astro check + Prettier)
        run: pnpm check

      - name: Build
        run: pnpm build

      - name: Deploy to dev.duovalerorodriguez.es
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm wrangler deploy --env preview
